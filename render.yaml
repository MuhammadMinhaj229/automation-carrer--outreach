# Render Blueprint: persistent FastAPI API + separate long-running worker.
# Secrets are prompted at Blueprint deployment; never commit real values here.
envVarGroups:
  - name: acios-production-secrets
    envVars:
      - key: ACIOS_BACKEND_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RESUME_STORAGE_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RESUME_STORAGE_REGION
        sync: false

services:
  - type: web
    name: acios-api
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: acios-production-secrets
      - key: ACIOS_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: acios_production
      - key: DRY_RUN
        value: "true"
      - key: RESUME_STORAGE_BACKEND
        value: s3

  - type: worker
    name: acios-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m acios.worker
    envVars:
      - fromGroup: acios-production-secrets
      - key: ACIOS_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: acios_production
      - key: DRY_RUN
        value: "true"
      - key: RESUME_STORAGE_BACKEND
        value: s3
