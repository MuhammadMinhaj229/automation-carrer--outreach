name: ACIOS CI/CD Pipeline

on:
  push:
    branches: [ main, master, "security/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Block private runtime artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/|^config/candidate_profile\.yaml$|\.(pdf|db|sqlite|sqlite3|xlsx|xls|csv|parquet)$)'; then
            echo "Private runtime data must not be committed."
            exit 1
          fi

      - name: Run Test Suite
        run: |
          python -m pytest tests/test_modules_sieve_and_verifier.py tests/test_database_repository.py tests/test_security_and_mcp_workflow.py tests/test_fastmcp_server.py -v

  frontend-build:
    name: Next.js Cockpit Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Verify Next.js Production Build
        working-directory: ./web
        run: npm run build
