name: ACIOS Local Core CI

on:
  push:
    branches: [main, master, "refactor/**", "security/**"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  local-core:
    name: Local core tests and quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install local core and test compatibility extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,legacy-api,mongodb,s3,ai,documents]"

      - name: Reject private runtime files in Git
        shell: bash
        run: |
          if git ls-files | grep -E '(^data/|^config/candidate_profile\.yaml$|\.(pdf|db|sqlite|sqlite3|xlsx|xls|csv|parquet|doc|docx|eml|mbox|vcf|jsonl)$)'; then
            echo "Private runtime data must not be committed."
            exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env($|/)|(^|/)(storage_state\.json|playwright\.state)$'; then
            echo "Secrets and browser session state must not be tracked."
            exit 1
          fi

      - name: Static syntax and correctness checks
        run: ruff check acios tests --select E7,E9

      - name: Run complete test suite
        run: pytest -q

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependency auditor
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit core requirements
        run: pip-audit -r requirements.txt

  security-lint:
    name: Static security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security linter
        run: python -m pip install --upgrade pip bandit
      - name: Scan core domain and execution modules
        run: bandit -r acios/core acios/models -ll
