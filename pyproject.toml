[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acios"
version = "2.5.0"
description = "Local-first, evidence-backed career intelligence and human-reviewed outreach workbench"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ACIOS Contributors" }
]
keywords = [
    "career-automation",
    "cold-outreach",
    "ai-agents",
    "deliverability-shield",
    "salesgpt",
    "email-sieve",
    "local-first",
    "sqlite",
    "mcp",
    "rfc-permutations"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "dnspython>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "requests>=2.32.3",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "fastmcp>=4.1.3,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mongomock>=4.1.2",
    "ruff>=0.11.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.0"
]
legacy-api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12"
]
mongodb = [
    "pymongo>=4.9.0",
    "redis>=5.1.0"
]
s3 = ["boto3>=1.35.0"]
ai = ["google-genai>=2.33.0,<3.0.0"]
documents = ["reportlab>=4.2.5"]
crawl4ai = ["crawl4ai>=0.7.0"]
browser-use = ["browser-use>=0.1.0"]
crawlee = ["crawlee[beautifulsoup]>=0.6.0"]
scrapy = ["Scrapy>=2.11.0"]
markitdown = ["markitdown[all]>=0.1.0"]
scrapling = ["scrapling[fetchers]>=0.2.0"]
autoscraper = ["autoscraper>=1.1.14"]

[project.scripts]
acios = "acios.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acios*"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["web", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live_integration'"
markers = [
    "live_integration: explicitly uses live websites or external providers; opt in when credentials/network are available",
]
