[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acios"
version = "2.5.0"
description = "Autonomous Career Intelligence & Outbound Operating System (ACIOS) - Decoupled 8-Phase Outreach Platform for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ACIOS Contributors" }
]
keywords = [
    "career-automation",
    "cold-outreach",
    "ai-agents",
    "deliverability-shield",
    "salesgpt",
    "email-sieve",
    "fastapi",
    "nextjs",
    "rfc-permutations"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "dnspython>=2.7.0",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.5",
    "requests>=2.32.3",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "feedparser>=6.0.11",
    "pymongo>=4.9.0",
    "boto3>=1.35.0",
    "redis>=5.1.0",
    "fastmcp>=4.1.3,<5"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "mongomock>=4.1.2"
]

[project.scripts]
acios = "acios.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["acios*"]
